version: '3.9'
services:
  api:
    build: .
    ports:
      - '4000:4000'
    environment:
      - SESSION_SECRET=supersecret
      - CLIENT_ORIGIN=http://localhost:3000
    volumes:
      - ./data:/app/data
    command: node server.js
  frontend:
    build: ./frontend
    ports:
      - '3000:3000'
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:4000
      - API_BASE_URL=http://api:4000/api
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - api
